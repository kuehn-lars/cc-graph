<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="420" viewBox="0 0 1280 420" role="img" aria-labelledby="t d">
  <title id="t">cc-graph</title>
  <desc id="d">A live graph of what Claude Code knows, read and changed: files as boxes grouped in folder frames, linked by their imports.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1b1a"/>
      <stop offset="1" stop-color="#121211"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="focusGlow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#D97757" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#D97757" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
    <mask id="gaps"><rect width="1280" height="420" fill="#fff"/><rect x="732" y="40" width="72" height="16" fill="#000"/><rect x="962" y="40" width="98" height="16" fill="#000"/><rect x="812" y="162" width="82" height="16" fill="#000"/><rect x="1052" y="222" width="66" height="16" fill="#000"/></mask>
    <clipPath id="frame"><rect width="1280" height="420" rx="18"/></clipPath>
  </defs>

  <style>
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .box { fill: #1e1e1d; stroke: #55554f; stroke-width: 1.2; }
    .frame { fill: none; stroke: #3b3b37; stroke-width: 1.2; }
    .ftitle { fill: #8c8b86; font-size: 13px; }
    .name { fill: #ecebe7; font-size: 14px; font-weight: 600; }
    .dim { fill: #8c8b86; }
    .edge { fill: none; stroke: #6a6964; stroke-width: 1.3; stroke-dasharray: 5 5; animation: flow 1.6s linear infinite; }
    .hot { stroke: #D97757; stroke-width: 1.6; }
    .bar { stroke: #B1B9F9; stroke-width: 2.4; stroke-linecap: round; }
    .spark { transform-box: fill-box; transform-origin: center; animation: spin 14s linear infinite; }
    .focus { animation: pulse 3.2s ease-in-out infinite; }
    .halo { animation: halo 3.2s ease-in-out infinite; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    .born { animation: born 6s ease-out infinite; }
    @keyframes flow { to { stroke-dashoffset: -20; } }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes pulse {
      0%, 55% { stroke: #D97757; }
      62% { stroke: #ffffff; }
      70% { stroke: #FFA98A; }
      80%, 100% { stroke: #D97757; }
    }
    @keyframes halo { 0%, 55% { opacity: .35; } 66% { opacity: 1; } 100% { opacity: .35; } }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes born { 0%, 8% { opacity: 0; } 18%, 100% { opacity: 1; } }
    @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
  </style>

  <g clip-path="url(#frame)">
    <rect width="1280" height="420" fill="url(#bg)"/>
    <rect width="1280" height="420" fill="url(#dots)"/>
    <circle cx="150" cy="120" r="320" fill="url(#glow)"/>
    <circle cx="905" cy="216" r="110" fill="url(#focusGlow)" class="halo"/>
  </g>
  <rect x="0.5" y="0.5" width="1279" height="419" rx="18" fill="none" stroke="#2c2b28"/>

  <!-- left: wordmark -->
  <g transform="translate(72 0)">
    <text x="0" y="96" class="mono" font-size="13" font-weight="700" letter-spacing="1" fill="#D97757">// a claude code mod</text>

    <g transform="translate(0 122)">
      <g class="spark" stroke="#D97757" stroke-width="7" stroke-linecap="round">
        <line x1="26" y1="4" x2="26" y2="48"/>
        <line x1="6.9" y1="15" x2="45.1" y2="37"/>
        <line x1="6.9" y1="37" x2="45.1" y2="15"/>
      </g>
    </g>
    <text x="72" y="168" class="mono" font-size="64" font-weight="800" fill="#f5f4ef" letter-spacing="-2">cc-graph</text>

    <text x="0" y="226" class="mono" font-size="27" font-weight="700" fill="#ecebe7" letter-spacing="-0.5">See what Claude knows<tspan fill="#D97757">.</tspan><tspan class="cursor" fill="#D97757">▍</tspan></text>
    <text x="0" y="266" class="mono" font-size="15.5" fill="#9b9a94">Every file it read, searched and changed, and what is</text>
    <text x="0" y="290" class="mono" font-size="15.5" fill="#9b9a94">still in its context window, live beside the conversation.</text>

    <!-- context meter, as the pane draws it -->
    <g transform="translate(0 340)" class="mono" font-size="14">
      <rect x="0" y="-6" width="132" height="3" rx="1.5" fill="#3b3b37"/>
      <rect x="0" y="-6" width="9" height="3" rx="1.5" fill="#B1B9F9"/>
      <text x="148" y="0" fill="#ecebe7"><tspan font-weight="700">5%</tspan><tspan class="dim"> of </tspan><tspan font-weight="700">1M</tspan><tspan dx="9">≈</tspan><tspan font-weight="700">2.2k</tspan><tspan class="dim"> tokens · </tspan><tspan font-weight="700">10</tspan><tspan class="dim"> files · </tspan><tspan font-weight="700">1</tspan><tspan class="dim"> compacted</tspan></text>
    </g>
  </g>

  <!-- right: the graph -->
  <g class="mono">
    <!-- edges -->
    <path class="edge" d="M815 110 V150 H1055 V110"/>
    <path class="edge hot" d="M905 150 V196"/>
    <path class="edge hot" d="M905 236 V290"/>
    <path class="edge hot" d="M987 216 H1148 V256"/>
    <path class="edge" d="M1148 296 V322"/>
    <path class="edge" d="M905 330 V378"/>

    <!-- src/api/ -->
    <rect class="frame" mask="url(#gaps)" x="720" y="48" width="190" height="82" rx="6"/>
    <text class="ftitle" x="738" y="52">src/api/</text>
    <rect class="box" x="738" y="70" width="154" height="40" rx="6"/>
    <circle cx="758" cy="90" r="4.5" fill="none" stroke="#B1B9F9" stroke-width="1.4"/>
    <path d="M758 85.5 a4.5 4.5 0 0 0 0 9 z" fill="#B1B9F9"/>
    <text class="name" x="772" y="95">users.ts</text>
    <line class="bar" x1="745" y1="108" x2="775" y2="108"/>

    <!-- src/routes/ -->
    <rect class="frame" mask="url(#gaps)" x="950" y="48" width="210" height="82" rx="6"/>
    <text class="ftitle" x="968" y="52">src/routes/</text>
    <rect class="box" x="968" y="70" width="174" height="40" rx="6" stroke-dasharray="3 3" fill="#1a1a19"/>
    <circle cx="990" cy="90" r="4.5" fill="none" stroke="#8c8b86" stroke-width="1.4"/>
    <text class="name dim" x="1004" y="95" font-weight="400">index.ts</text>

    <!-- src/auth/ -->
    <rect class="frame" mask="url(#gaps)" x="800" y="170" width="210" height="186" rx="6"/>
    <text class="ftitle" x="818" y="174">src/auth/</text>
    <rect class="box focus" x="823" y="196" width="164" height="40" rx="6" stroke="#D97757" stroke-width="1.6"/>
    <circle cx="843" cy="216" r="4.5" fill="#B1B9F9"/>
    <text class="name" x="857" y="221">login.ts</text>
    <line class="bar" x1="830" y1="234" x2="920" y2="234"/>

    <rect class="box" x="823" y="290" width="164" height="40" rx="6"/>
    <circle cx="843" cy="310" r="4.5" fill="#B1B9F9"/>
    <text class="name" x="857" y="315">password.ts</text>
    <line class="bar" x1="830" y1="328" x2="895" y2="328"/>

    <!-- src/db/ -->
    <rect class="frame" mask="url(#gaps)" x="1040" y="230" width="216" height="148" rx="6"/>
    <text class="ftitle" x="1058" y="234">src/db/</text>
    <rect class="box" x="1056" y="256" width="184" height="40" rx="6" stroke="#FFC107"/>
    <circle cx="1076" cy="276" r="4.5" fill="#B1B9F9"/>
    <text class="name" x="1090" y="281">redis.ts</text>
    <text x="1172" y="281" font-size="13" font-weight="700"><tspan fill="#4EBA65">+6</tspan><tspan fill="#FF6B80"> −0</tspan></text>
    <line class="bar" x1="1063" y1="294" x2="1140" y2="294"/>

    <g class="born">
      <rect class="box" x="1056" y="322" width="184" height="40" rx="6" stroke="#4EBA65"/>
      <circle cx="1076" cy="342" r="4.5" fill="#B1B9F9"/>
      <text class="name" x="1090" y="347">README.md</text>
      <text x="1176" y="347" font-size="13" font-weight="700" fill="#4EBA65">+27</text>
      <line class="bar" x1="1063" y1="360" x2="1180" y2="360"/>
    </g>

    <!-- ghost: imported, never opened -->
    <g fill="#8c8b86">
      <circle cx="864" cy="392" r="1.6"/><circle cx="870" cy="392" r="1.6"/><circle cx="876" cy="392" r="1.6"/>
      <text x="886" y="397" font-size="14" font-style="italic">config.ts</text>
    </g>
  </g>
</svg>
